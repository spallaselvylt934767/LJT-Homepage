name: Build and deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.setup-pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Succeeds only when GitHub Pages is enabled with "GitHub Actions" as
      # the publishing source. Until then the site is still built below so the
      # content can be validated, and deployment starts automatically as soon
      # as Pages is switched on in the repository settings.
      - name: Setup Pages
        id: setup-pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        if: steps.setup-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: needs.build.outputs.pages-enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4